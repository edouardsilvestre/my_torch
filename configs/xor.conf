# Petit réseau qui apprend XOR : sert d'exemple et de test du format.
# Ces réglages ont appris XOR sur 100 graines sur 100, avec ou sans mélange des données.

[network]
input_size = 2
layers = [
    { size = 4, activation = "tanh" },
    { size = 2, activation = "identity" },   # scores bruts : la cross-entropy applique softmax
]
initializer = "xavier_normal"
seed = 0

[training]
loss = "cross_entropy"
epochs = 2000
batch_size = 4
seed = 0

[optimizer]
name = "sgd"
learning_rate = 0.5
