# o3_256_256_64 avec l'early stopping, comparée sur la validation du dataset fourni
# (docs/regularisation.md). L2 dix fois plus fort.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 30
batch_size = 64
seed = 0
l2 = 0.001
patience = 3
monitor = "val_accuracy"

[optimizer]
name = "adam"
learning_rate = 0.001
