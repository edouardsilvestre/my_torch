# o3_256_256_64 avec L2 = 1e-4 et un dropout de 0.1 sur les couches cachées, comparée sur la
# validation du dataset fourni avec l'early stopping (docs/dropout.md).

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu", dropout = 0.1 },
    { size = 256, activation = "relu", dropout = 0.1 },
    { size = 64, activation = "relu", dropout = 0.1 },
    { size = 5, activation = "identity" },
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 40
batch_size = 64
seed = 0
l2 = 0.0001
patience = 3
monitor = "val_accuracy"

[optimizer]
name = "adam"
learning_rate = 0.001
