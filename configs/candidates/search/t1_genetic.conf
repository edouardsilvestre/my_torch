# Le meilleur essai de l'algorithme génétique (docs/recherche.md), entraîné sur tout le dataset
# fourni avec l'early stopping, pour vérifier que son classement tient avec plus de données.

[network]
input_size = 769
layers = [
    { size = 128, activation = "leaky_relu", dropout = 0.2 },
    { size = 5, activation = "identity" },
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 40
batch_size = 64
seed = 0
l2 = 0.0001
patience = 3
monitor = "val_accuracy"

[optimizer]
name = "adam"
learning_rate = 0.00153
