# Candidate entraînée sur le dataset fourni, comparée sur sa validation (docs/reseau_final.md).
# Plus profond : une couche cachée de plus.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 10
batch_size = 64
seed = 0

[optimizer]
name = "adam"
learning_rate = 0.001
