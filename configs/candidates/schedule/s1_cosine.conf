# o3_256_256_64 avec L2 = 1e-4, comme le réseau poussé, et un learning rate qui descend
# en cosinus de 1e-3 à 1e-5 sur les 30 epochs.
# Comparée sur la validation du dataset fourni au learning rate fixe (docs/learning_rate.md).

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 30
batch_size = 64
seed = 0
l2 = 0.0001
patience = 3
monitor = "val_accuracy"
schedule = { name = "cosine", minimum = 0.00001 }

[optimizer]
name = "adam"
learning_rate = 0.001
