# Configuration du réseau pré-entraîné my_torch_network.nn.
# C'est la candidate c1_256_64, la plus simple et la plus rapide des quatre comparées sur le
# jeu de validation, avec 5 epochs : sa meilleure précision de validation est atteinte à
# l'epoch 5, puis le réseau ne fait plus que surapprendre (docs/reseau_final.md).
# Le réseau se reconstruit avec ./scripts/build_network.sh.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },     # Nothing, Check et Checkmate, avec les couleurs
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 5
batch_size = 64
seed = 0

[optimizer]
name = "adam"
learning_rate = 0.001
