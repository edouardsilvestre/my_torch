# Configuration du réseau pré-entraîné my_torch_network.nn.
# C'est la candidate o3_256_256_64 : sur le dataset fourni avec le sujet, elle a la meilleure
# précision de validation des trois configurations comparées, atteinte à l'epoch 10
# (docs/reseau_final.md).
# Le réseau se reconstruit avec ./scripts/build_network.sh.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },     # Nothing, Check et Checkmate, avec les couleurs
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 10
batch_size = 64
seed = 0

[optimizer]
name = "adam"
learning_rate = 0.001
