# Configuration du réseau pré-entraîné my_torch_network.nn.
# C'est la candidate o3_256_256_64 avec une régularisation L2 de 1e-4 et un learning rate divisé
# par 2 quand la validation cesse de progresser : sur le dataset fourni avec le sujet, il a baissé
# avant les epochs 17 et 19, et l'early stopping garde l'epoch 19 (docs/learning_rate.md,
# docs/reseau_final.md). Le réseau est réentraîné jusqu'à cette epoch, avec les mêmes paliers.
# Le réseau se reconstruit avec ./scripts/build_network.sh.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },     # Nothing, Check et Checkmate, avec les couleurs
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 19
batch_size = 64
seed = 0
l2 = 0.0001
schedule = { name = "multistep", factor = 0.5, milestones = [17, 19] }

[optimizer]
name = "adam"
learning_rate = 0.001
