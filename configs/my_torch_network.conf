# Configuration du réseau pré-entraîné my_torch_network.nn.
# C'est la candidate o3_256_256_64 avec une régularisation L2 de 1e-4 : sur le dataset fourni
# avec le sujet, l'early stopping garde son epoch 24, la meilleure en validation
# (docs/regularisation.md, docs/reseau_final.md). Le réseau est réentraîné jusqu'à cette epoch.
# Le réseau se reconstruit avec ./scripts/build_network.sh.

[network]
input_size = 769
layers = [
    { size = 256, activation = "relu" },
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 5, activation = "identity" },     # Nothing, Check et Checkmate, avec les couleurs
]
initializer = "he"
seed = 0

[training]
loss = "cross_entropy"
epochs = 24
batch_size = 64
seed = 0
l2 = 0.0001

[optimizer]
name = "adam"
learning_rate = 0.001
