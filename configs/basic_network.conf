# Réseau de départ pour l'analyse d'échiquiers.
# PROVISOIRE : le nombre de sorties dépend des labels retenus (#16), et les
# réglages ne sont pas encore mesurés : ils seront choisis par les benchmarks.

[network]
input_size = 769                                # 12 x 64 cases, plus le trait (docs/encodage.md)
layers = [
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 3, activation = "identity" },     # Nothing, Check, Checkmate
]
initializer = "he"

[training]
loss = "cross_entropy"
epochs = 20
batch_size = 64

[optimizer]
name = "adam"
learning_rate = 0.001
