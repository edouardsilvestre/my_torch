# Réseau de départ pour l'analyse d'échiquiers.
# PROVISOIRE : la taille d'entrée dépend de l'encodage de l'échiquier (#15),
# et le nombre de sorties dépend des labels retenus (#16). Les réglages ne sont
# pas encore mesurés : ils seront choisis par les benchmarks.

[network]
input_size = 768                                # 12 types de pièces x 64 cases
layers = [
    { size = 256, activation = "relu" },
    { size = 64, activation = "relu" },
    { size = 3, activation = "identity" },     # Nothing, Check, Checkmate
]
initializer = "he"

[training]
loss = "cross_entropy"
epochs = 20
batch_size = 64

[optimizer]
name = "adam"
learning_rate = 0.001
